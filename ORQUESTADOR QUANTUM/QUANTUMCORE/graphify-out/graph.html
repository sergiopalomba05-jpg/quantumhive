<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuantumCore · Grafo Graphify</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #030712; color: #e5edf8; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: radial-gradient(circle at 20% 0%, rgba(34,211,238,.18), transparent 34rem), #030712; }
    header { position: fixed; inset: 0 0 auto 0; z-index: 2; display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-bottom: 1px solid rgba(148,163,184,.18); background: rgba(2,6,23,.82); backdrop-filter: blur(18px); }
    h1 { margin: 0; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px #000; }
    .meta { color: #94a3b8; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    input { margin-left: auto; width: min(420px, 36vw); border: 1px solid rgba(34,211,238,.28); border-radius: 10px; background: rgba(15,23,42,.72); color: #fff; padding: 10px 12px; outline: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    aside { position: fixed; right: 16px; top: 76px; z-index: 3; width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 96px); overflow: auto; border: 1px solid rgba(148,163,184,.18); border-radius: 18px; background: rgba(2,6,23,.84); box-shadow: 0 24px 80px rgba(0,0,0,.55); padding: 16px; }
    .chip { display: inline-flex; margin: 4px 6px 0 0; padding: 3px 7px; border-radius: 999px; border: 1px solid rgba(34,211,238,.24); color: #67e8f9; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { color: #94a3b8; }
    .small { font-size: 12px; line-height: 1.5; }
    a { color: #67e8f9; }
  </style>
</head>
<body>
  <header>
    <h1>Grafo Graphify</h1>
    <div id="meta" class="meta">Cargando graph.json...</div>
    <input id="search" placeholder="Buscar nodo, archivo, comunidad..." />
  </header>
  <canvas id="graph"></canvas>
  <aside id="detail">
    <h2 style="margin:0 0 8px;font-size:18px">QuantumCore Graph</h2>
    <p class="small muted">Visualizacion directa desde <code>/graphify-out/graph.json</code>. Usa buscar para filtrar y hacé click sobre un nodo para ver detalles.</p>
  </aside>
  <script>
    const canvas = document.getElementById('graph');
    const ctx = canvas.getContext('2d');
    const meta = document.getElementById('meta');
    const detail = document.getElementById('detail');
    const search = document.getElementById('search');
    const colors = { code: '#22d3ee', document: '#fbbf24', concept: '#34d399', rationale: '#c084fc', image: '#fb7185' };
    let graph = { nodes: [], links: [] };
    let nodes = [];
    let links = [];
    let hovered = null;
    let query = '';

    function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); draw(); }
    addEventListener('resize', resize);

    function initLayout() {
      const w = innerWidth;
      const h = innerHeight;
      nodes = graph.nodes.map((n, i) => {
        const angle = (i / Math.max(1, graph.nodes.length)) * Math.PI * 2;
        const r = 90 + ((n.community || 0) % 23) * 14;
        return { ...n, x: w / 2 + Math.cos(angle) * r + (Math.random() - .5) * 80, y: h / 2 + Math.sin(angle) * r + (Math.random() - .5) * 80, vx: 0, vy: 0 };
      });
      const byId = new Map(nodes.map(n => [n.id, n]));
      links = (graph.links || []).map(l => ({ ...l, sourceNode: byId.get(l.source), targetNode: byId.get(l.target) })).filter(l => l.sourceNode && l.targetNode);
    }

    function tick() {
      const w = innerWidth;
      const h = innerHeight;
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        const dx = a.x - w / 2;
        const dy = a.y - h / 2;
        a.vx += -dx * 0.0006;
        a.vy += -dy * 0.0006;
      }
      for (const l of links.slice(0, 5000)) {
        const a = l.sourceNode;
        const b = l.targetNode;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.max(1, Math.hypot(dx, dy));
        const force = (d - 70) * 0.0009;
        const fx = dx / d * force;
        const fy = dy / d * force;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      }
      for (const n of nodes) {
        n.vx *= 0.88; n.vy *= 0.88;
        n.x += n.vx; n.y += n.vy;
      }
    }

    function nodeMatches(n) {
      if (!query) return true;
      const text = `${n.label || ''} ${n.id || ''} ${n.type || n.file_type || ''} ${n.community || ''} ${n.source_file || ''}`.toLowerCase();
      return text.includes(query);
    }

    function draw() {
      if (!ctx) return;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.save();
      ctx.translate(0, 44);
      ctx.globalAlpha = query ? 0.1 : 0.18;
      ctx.strokeStyle = '#334155';
      for (const l of links.slice(0, 7000)) {
        ctx.beginPath();
        ctx.moveTo(l.sourceNode.x, l.sourceNode.y);
        ctx.lineTo(l.targetNode.x, l.targetNode.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      for (const n of nodes) {
        const match = nodeMatches(n);
        const type = n.type || n.file_type || 'node';
        const radius = hovered === n ? 7 : Math.max(2.4, Math.min(6, ((n.importance || 0.25) * 8)));
        ctx.globalAlpha = query && !match ? 0.08 : 0.92;
        ctx.fillStyle = colors[type] || '#94a3b8';
        ctx.beginPath();
        ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function showNode(n) {
      const type = n.type || n.file_type || 'node';
      detail.innerHTML = `<div class="chip">${type}</div><h2 style="margin:10px 0 8px;font-size:18px;color:#fff">${escapeHtml(n.label || n.id)}</h2><p class="small muted">${escapeHtml(n.summary || 'Sin resumen')}</p><p class="small"><b>Comunidad:</b> C${n.community ?? '-'}<br><b>Importancia:</b> ${Math.round((n.importance || 0) * 100)}%<br><b>Fuente:</b> ${escapeHtml(n.source_file || n.source_location || '-')}</p><p class="small muted">ID: ${escapeHtml(n.id)}</p>`;
    }

    function escapeHtml(value) { return String(value).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    canvas.addEventListener('mousemove', e => {
      const x = e.clientX;
      const y = e.clientY - 44;
      hovered = nodes.find(n => Math.hypot(n.x - x, n.y - y) < 9) || null;
      canvas.style.cursor = hovered ? 'pointer' : 'default';
    });
    canvas.addEventListener('click', () => hovered && showNode(hovered));
    search.addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); draw(); });

    fetch('./graph.json').then(r => r.json()).then(data => {
      graph = data;
      meta.textContent = `${(data.nodes || []).length.toLocaleString()} nodos · ${(data.links || []).length.toLocaleString()} aristas`;
      initLayout(); resize();
      setInterval(() => { for (let i = 0; i < 3; i++) tick(); draw(); }, 33);
    }).catch(err => { meta.textContent = 'No se pudo cargar graph.json'; detail.innerHTML = `<p>${escapeHtml(err.message)}</p>`; });
  </script>
</body>
</html>
